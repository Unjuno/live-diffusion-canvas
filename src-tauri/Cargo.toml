[package]
name = "live-diffusion-canvas"
version = "0.1.0"
description = "Live Diffusion Canvas desktop shell"
authors = ["Unjuno"]
edition = "2021"

[lib]
name = "live_diffusion_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
